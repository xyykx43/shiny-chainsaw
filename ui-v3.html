<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120C0A">
<title>星尘·古牌 · 书页版</title>
<style>
/* ==================================================================
   插画叙事版
   · 每一页 = 一帧画面 + 一条旁白
   · 翻页是真的绕书脊旋转，带纸面阴影扫过
   · 点击推进，画面分层浮现
   ================================================================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
:root{
  --desk:#120C0A;
  --paper:#EFE5CE;
  --paper-2:#F8F1E1;
  --ink:#2B2118;
  --ink-2:#5C4B39;
  --rubric:#8C3A2E;
  --brass:#A98B4F;
  --serif:"Songti SC","Noto Serif SC",Georgia,serif;
  --latin:"Didot","Times New Roman",Georgia,serif;
  --ease:cubic-bezier(.32,.72,.3,1);
}
body{
  background:var(--desk);color:var(--paper);min-height:100dvh;
  font-family:var(--serif);overflow:hidden;position:relative;
  -webkit-font-smoothing:antialiased;user-select:none;
}
.desk{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(80% 50% at 50% 18%,rgba(190,158,104,.14),transparent 72%),
    radial-gradient(120% 90% at 50% 116%,#080605,transparent 62%),
    linear-gradient(180deg,#1C1411,#0D0908);}
.desk::after{content:"";position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.5'/></svg>");}

/* ---------------- 舞台 ---------------- */
.stage{
  position:relative;z-index:2;height:100dvh;width:100%;max-width:560px;margin:0 auto;
  perspective:1900px;perspective-origin:50% 40%;
  display:flex;align-items:center;justify-content:center;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
}

/* ---------------- 封面 ---------------- */
.cover{
  position:relative;width:100%;max-width:460px;aspect-ratio:3/4.2;
  background:
    radial-gradient(110% 80% at 50% 0%,rgba(120,84,52,.38),transparent 62%),
    linear-gradient(160deg,#3A241C,#241511 55%,#180F0C);
  border:1px solid rgba(169,139,79,.32);
  box-shadow:0 50px 90px -50px #000,inset 0 0 80px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 24px;
  transform-origin:left center;
  transition:transform 1s var(--ease),opacity .9s var(--ease);
  cursor:pointer;
}
.cover::before{content:"";position:absolute;inset:9px;border:1px solid rgba(169,139,79,.55);pointer-events:none;}
.cover::after{content:"";position:absolute;inset:15px;border:1px solid rgba(169,139,79,.24);pointer-events:none;}
.cover .cn-corner{position:absolute;width:22px;height:22px;opacity:.8;}
.cover .cn-corner.tl{top:6px;left:6px;}
.cover .cn-corner.tr{top:6px;right:6px;transform:rotate(90deg);}
.cover .cn-corner.br{bottom:6px;right:6px;transform:rotate(180deg);}
.cover .cn-corner.bl{bottom:6px;left:6px;transform:rotate(270deg);}
.cover .seal{margin-top:26px;opacity:.9;}
.cover.open{transform:rotateY(-172deg);opacity:0;}
.cover .top{font-family:var(--latin);font-size:.54rem;letter-spacing:.46em;color:var(--brass);text-transform:uppercase;}
.cover h1{margin-top:26px;font-size:clamp(1.55rem,6.6vw,2.1rem);font-weight:500;letter-spacing:.26em;text-indent:.26em;color:var(--paper-2);line-height:1.4;white-space:nowrap;}
.cover .lat{margin-top:14px;font-family:var(--latin);font-size:.54rem;letter-spacing:.4em;color:var(--brass);text-transform:uppercase;opacity:.9;}
.cover .rule{display:flex;align-items:center;gap:10px;width:64%;margin:24px auto 0;}
.cover .rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(169,139,79,.7),transparent);}
.cover .rule b{width:4px;height:4px;background:var(--brass);transform:rotate(45deg);}
.cover .sub{margin-top:18px;font-size:.72rem;letter-spacing:.34em;text-indent:.34em;color:rgba(239,229,206,.6);}
.cover .tap{margin-top:34px;font-family:var(--latin);font-size:.52rem;letter-spacing:.34em;color:rgba(169,139,79,.8);text-transform:uppercase;
  animation:breathe 3.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.4;}50%{opacity:1;}}

/* ---------------- 书页 ---------------- */
.book{position:absolute;inset:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  display:none;transform-style:preserve-3d;}
.book.on{display:block;}

.sheet{
  position:absolute;inset:0;
  background:var(--paper);color:var(--ink);
  box-shadow:0 30px 70px -40px #000;
  transform-origin:left center;
  transform-style:preserve-3d;
  overflow:hidden;
  will-change:transform;
}
.sheet.turning{transition:transform .82s cubic-bezier(.44,.06,.28,1),box-shadow .82s ease;}
.sheet.turning-in{transition:transform .82s cubic-bezier(.44,.06,.28,1);}

/* 纸纹 / 压边 */
.page{backface-visibility:hidden;}          /* 转过 90° 后正文消失 */
.backside{position:absolute;inset:0;z-index:5;pointer-events:none;
  transform:rotateY(180deg);backface-visibility:hidden;
  background:linear-gradient(200deg,#F3EAD6,#E6DBC1 60%,#DFD3B7);
  box-shadow:inset 0 0 46px rgba(90,74,56,.26);}
.backside::after{content:"";position:absolute;inset:0;opacity:.18;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4'/></filter><rect width='170' height='170' filter='url(%23b)' opacity='.4'/></svg>");}
.sheet .grain{position:absolute;inset:0;pointer-events:none;opacity:.20;mix-blend-mode:multiply;z-index:6;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4'/></filter><rect width='170' height='170' filter='url(%23p)' opacity='.42'/></svg>");}
.sheet .edge{position:absolute;inset:0;pointer-events:none;z-index:6;
  box-shadow:inset 0 0 52px rgba(90,74,56,.20),inset 0 -22px 34px -18px rgba(90,74,56,.20);}
.sheet .spine-shade{position:absolute;left:0;top:0;bottom:0;width:56px;z-index:7;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(20,14,10,.55),transparent);}
.sheet.turning .spine-shade{opacity:1;transition:opacity .4s;}
/* 翻页时扫过的高光 */
.sheet .sweep{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,rgba(255,246,225,.55) 0%,rgba(255,246,225,.08) 28%,transparent 46%);}
.sheet.turning .sweep{animation:sweep .82s linear;}
@keyframes sweep{0%{opacity:0;}18%{opacity:.85;}60%{opacity:.25;}100%{opacity:0;}}

/* 中世纪花边 */
.ruleframe{position:absolute;inset:10px;border:1px solid rgba(43,33,24,.5);z-index:4;pointer-events:none;}
.ruleframe::before{content:"";position:absolute;inset:3px;border:1px solid rgba(169,139,79,.55);}
.corner{position:absolute;width:24px;height:24px;z-index:5;pointer-events:none;}
.corner svg{width:100%;height:100%;display:block;}
.corner.tl{top:5px;left:5px;}
.corner.tr{top:5px;right:5px;transform:rotate(90deg);}
.corner.br{bottom:5px;right:5px;transform:rotate(180deg);}
.corner.bl{bottom:5px;left:5px;transform:rotate(270deg);}

/* 页内布局 */
.page{position:absolute;inset:0;display:flex;flex-direction:column;padding:24px 18px 16px;z-index:3;}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}
.runhead{display:flex;justify-content:space-between;font-family:var(--latin);font-size:.5rem;
  letter-spacing:.28em;text-transform:uppercase;color:var(--ink-2);opacity:.7;padding:0 8px;}
.plateno{margin-top:16px;text-align:center;font-family:var(--latin);font-size:.56rem;letter-spacing:.42em;
  text-transform:uppercase;color:var(--rubric);}

/* 画面 */
.art{
  position:relative;margin:10px auto 0;width:min(74%,286px);aspect-ratio:270/456;
  border:1px solid rgba(43,33,24,.55);padding:5px;background:rgba(255,255,255,.45);
  box-shadow:0 16px 34px -24px rgba(43,33,24,.95);
  overflow:hidden;
}
.art::before{content:"";position:absolute;inset:3px;border:1px solid rgba(169,139,79,.6);z-index:2;pointer-events:none;}
.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0;
  /* 不用 transform 缩放：部分机型上会导致图片底部出现灰色未绘制块 */
  filter:sepia(.10) contrast(1.03) saturate(.92);}
.art .glaze{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,transparent 45%,rgba(60,44,30,.28) 100%);}

/* 旁白带 */
.band{
  width:min(74%,286px);margin:0 auto;position:relative;
  background:linear-gradient(180deg,rgba(34,25,20,.96),rgba(24,17,13,.97));
  color:var(--paper-2);padding:11px 12px 12px;text-align:center;
  box-shadow:0 12px 26px -20px #000;
  border-top:1px solid rgba(169,139,79,.55);
}
.band .en{font-family:var(--latin);font-size:.5rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(230,208,164,.75);margin-bottom:7px;}
.band .cn{font-size:.84rem;line-height:1.75;letter-spacing:.04em;}

/* 逐条浮现 */
.rise{opacity:0;transform:translateY(14px);}
.sheet.enter .rise{animation:riseIn .8s var(--ease) forwards;}
.sheet.enter .r1{animation-delay:.10s;}
.sheet.enter .r2{animation-delay:.24s;}
.sheet.enter .r3{animation-delay:.38s;}
.sheet.enter .r4{animation-delay:.52s;}
@keyframes riseIn{to{opacity:1;transform:none;}}

/* 牌说 */
.moral{margin:16px auto 0;width:min(74%,286px);padding-top:12px;font-size:.78rem;line-height:1.9;
  color:var(--ink-2);border-top:1px solid rgba(43,33,24,.18);}
.moral b{color:var(--rubric);font-weight:400;letter-spacing:.18em;margin-right:6px;}
.folio{padding:10px 0 2px;text-align:center;font-family:var(--latin);font-size:.54rem;
  letter-spacing:.36em;color:var(--ink-2);opacity:.7;}

/* 提问页 */
.qwrap{margin-top:22px;padding:0 4px;}
.qwrap label{display:block;font-family:var(--latin);font-size:.52rem;letter-spacing:.34em;
  text-transform:uppercase;color:var(--rubric);margin-bottom:10px;}
.qwrap input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(43,33,24,.45);
  font-family:var(--serif);font-size:1.05rem;color:var(--ink);padding:10px 1px;outline:none;}
.qwrap input::placeholder{color:rgba(90,74,56,.5);}
.stamps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 4px 0;}
.stamp{padding:6px 13px;border:1px solid rgba(140,58,46,.5);background:transparent;color:var(--rubric);
  font-family:var(--serif);font-size:.72rem;letter-spacing:.14em;cursor:pointer;transition:all .3s;}
.stamp.on{background:var(--rubric);color:var(--paper-2);}
.drawzone{margin-top:28px;padding-top:0;text-align:center;}
.drawzone button{padding:14px 42px;background:transparent;border:1px solid var(--rubric);color:var(--rubric);
  font-family:var(--serif);font-size:.84rem;letter-spacing:.34em;text-indent:.34em;cursor:pointer;transition:all .35s;}
.drawzone button:active{background:var(--rubric);color:var(--paper-2);}

/* 结语 */
.endp{display:flex;flex-direction:column;height:100%;justify-content:center;text-align:center;padding:0 8px;}
.endp h2{font-size:1.05rem;font-weight:500;letter-spacing:.24em;color:var(--ink);}
.endp .lat{font-family:var(--latin);font-size:.54rem;letter-spacing:.36em;text-transform:uppercase;color:var(--rubric);margin-top:10px;}
.endp p{margin-top:20px;font-size:.88rem;line-height:2.1;color:var(--ink);text-align:justify;}
.endp .orn{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0;}
.endp .orn i{width:30px;height:1px;background:rgba(43,33,24,.3);}

/* 点击区与提示 */
.taphint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:60;font-family:var(--latin);font-size:.5rem;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(230,208,164,.55);pointer-events:none;transition:opacity .5s;white-space:nowrap;}
.taphint.hide{opacity:0;}
.chev{position:absolute;top:50%;transform:translateY(-50%);z-index:60;color:rgba(169,139,79,.55);
  font-size:1.1rem;pointer-events:none;opacity:0;transition:opacity .4s;}
.chev.l{left:8px;}
.chev.r{right:8px;}
.book.on .chev{opacity:.8;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}


/* ---- 应用版补充 ---- */
.endp{overflow:auto;justify-content:flex-start;padding-top:14px}
.endp .sum{text-align:justify;font-size:.86rem;line-height:2.05;color:var(--ink)}
.endp .sum b{font-weight:400;color:var(--rubric);letter-spacing:.16em;margin-right:6px}
.again{display:block;margin:24px auto 0;padding:12px 34px;background:none;border:1px solid var(--rubric);
  color:var(--rubric);font-family:var(--serif);font-size:.8rem;letter-spacing:.34em;text-indent:.34em;cursor:pointer}
.again:active{background:var(--rubric);color:var(--paper-2)}
.moral{max-height:none}
.art,.band,.moral{width:min(74%,272px)}
.endp{justify-content:center}
.endp .folio{margin-top:18px}
</style>
</head>
<body>
<div class="desk"></div>
<div class="stage">
  <section class="cover" id="cover">
    <div class="top">Liber Sortium</div>
    <h1>星尘·古牌</h1>
    <div class="lat">The Book of Gilded Arcana</div>
    <div class="rule"><i></i><b></b><i></i></div>
    <p class="sub">一次只问一件事</p>
    <div class="seal"><svg width="46" height="46" viewBox="0 0 46 46" fill="none">
      <circle cx="23" cy="23" r="21" stroke="rgba(169,139,79,.55)" stroke-width=".8"/>
      <circle cx="23" cy="23" r="16.5" stroke="rgba(169,139,79,.3)" stroke-width=".6"/>
      <path d="M23 11 L25.6 20.4 L35 23 L25.6 25.6 L23 35 L20.4 25.6 L11 23 L20.4 20.4 Z" fill="rgba(169,139,79,.75)"/>
    </svg></div>
    <div class="tap">tap to open</div>
  </section>

  <section class="book" id="book">
    <article class="sheet" id="sheetA">
      <div class="ruleframe"></div>
      <div class="corner tl"><svg viewBox="0 0 24 24" fill="none"><path d="M1 13 V1 H13" stroke="rgba(140,58,46,.75)" stroke-width="1"/><path d="M4.5 9.5 V4.5 H9.5" stroke="rgba(169,139,79,.85)" stroke-width=".8"/><circle cx="5" cy="5" r="1.7" fill="rgba(140,58,46,.6)"/></svg></div>
      <div class="corner tr"><svg viewBox="0 0 24 24" fill="none"><path d="M1 13 V1 H13" stroke="rgba(140,58,46,.75)" stroke-width="1"/><path d="M4.5 9.5 V4.5 H9.5" stroke="rgba(169,139,79,.85)" stroke-width=".8"/><circle cx="5" cy="5" r="1.7" fill="rgba(140,58,46,.6)"/></svg></div>
      <div class="corner br"><svg viewBox="0 0 24 24" fill="none"><path d="M1 13 V1 H13" stroke="rgba(140,58,46,.75)" stroke-width="1"/><path d="M4.5 9.5 V4.5 H9.5" stroke="rgba(169,139,79,.85)" stroke-width=".8"/><circle cx="5" cy="5" r="1.7" fill="rgba(140,58,46,.6)"/></svg></div>
      <div class="corner bl"><svg viewBox="0 0 24 24" fill="none"><path d="M1 13 V1 H13" stroke="rgba(140,58,46,.75)" stroke-width="1"/><path d="M4.5 9.5 V4.5 H9.5" stroke="rgba(169,139,79,.85)" stroke-width=".8"/><circle cx="5" cy="5" r="1.7" fill="rgba(140,58,46,.6)"/></svg></div>
      <div class="page" id="bodyA"></div>
      <div class="backside"></div>
      <div class="grain"></div><div class="edge"></div>
      <div class="spine-shade"></div><div class="sweep"></div>
    </article>
    <article class="sheet" id="sheetB" style="display:none;">
      <div class="ruleframe"></div>
      <div class="corner tl"><svg viewBox="0 0 24 24" fill="none"><path d="M1 13 V1 H13" stroke="rgba(140,58,46,.75)" stroke-width="1"/><path d="M4.5 9.5 V4.5 H9.5" stroke="rgba(169,139,79,.85)" stroke-width=".8"/><circle cx="5" cy="5" r="1.7" fill="rgba(140,58,46,.6)"/></svg></div>
      <div class="corner tr"><svg viewBox="0 0 24 24" fill="none"><path d="M1 13 V1 H13" stroke="rgba(140,58,46,.75)" stroke-width="1"/><path d="M4.5 9.5 V4.5 H9.5" stroke="rgba(169,139,79,.85)" stroke-width=".8"/><circle cx="5" cy="5" r="1.7" fill="rgba(140,58,46,.6)"/></svg></div>
      <div class="corner br"><svg viewBox="0 0 24 24" fill="none"><path d="M1 13 V1 H13" stroke="rgba(140,58,46,.75)" stroke-width="1"/><path d="M4.5 9.5 V4.5 H9.5" stroke="rgba(169,139,79,.85)" stroke-width=".8"/><circle cx="5" cy="5" r="1.7" fill="rgba(140,58,46,.6)"/></svg></div>
      <div class="corner bl"><svg viewBox="0 0 24 24" fill="none"><path d="M1 13 V1 H13" stroke="rgba(140,58,46,.75)" stroke-width="1"/><path d="M4.5 9.5 V4.5 H9.5" stroke="rgba(169,139,79,.85)" stroke-width=".8"/><circle cx="5" cy="5" r="1.7" fill="rgba(140,58,46,.6)"/></svg></div>
      <div class="page" id="bodyB"></div>
      <div class="backside"></div>
      <div class="grain"></div><div class="edge"></div>
      <div class="spine-shade"></div><div class="sweep"></div>
    </article>
    <div class="chev l">‹</div>
    <div class="chev r">›</div>
    <div class="taphint" id="hint">轻点右侧翻页</div>
  </section>

心，不是所有种子都立即结果。", "rev": "急躁，或计划失败。别拔苗助长。"}, "星币8": {"up": "学徒与精进，日复一日雕琢。你要么在埋头苦干，要么在精修技能。", "rev": "无聊，或工作狂。寻找乐趣，劳逸结合。"}, "星币9": {"up": "自给自足，物质丰盛。你拥有花园和美酒，独享宁静富足。", "rev": "依赖他人，或虚假安全。你的安全感应来自于内在。"}, "星币10": {"up": "世代财富，家族传承。你站在祖先的肩膀上，也可以成为后人的根基。", "rev": "破产，或家族纷争。打破恶性循环。"}, "权杖·侍从": {"up": "火信使，热情的新消息。你会收到激动人心的邀请或机会，充满好奇心。", "rev": "延误或幼稚。信息可能不实，再确认一下。"}, "权杖·骑士": {"up": "火之骑士，行动如风。他带来快速的进展或旅行，但缺乏持久力。", "rev": "躁动，或方向错误。小心冲动引起的冲突。"}, "权杖·王后": {"up": "火之女王，自信而温暖。她善于激励他人，是团队的精神领袖。", "rev": "控制欲强，或嫉妒。你的热情可能烫伤别人。"}, "权杖·国王": {"up": "火之国王，成熟且富有远见。他建立帝国，但也懂得休息。", "rev": "独裁，或事业危机。放下权威，多听意见。"}, "圣杯·侍从": {"up": "水信使，情感启蒙。你可能会坠入爱河，或收到艺术灵感。", "rev": "情绪化，或谎言。小心被人利用你的善良。"}, "圣杯·骑士": {"up": "水之骑士，浪漫的追求者。他会为了爱情或理想远行，充满诗意。", "rev": "失望，或逃避。对方可能不靠谱。"}, "圣杯·王后": {"up": "水之女王，直觉与慈悲。她像月亮一样滋养他人，是疗愈者。", "rev": "情绪淹没，或过度敏感。保护你的能量，别当情绪垃圾桶。"}, "圣杯·国王": {"up": "水之国王，冷静的情感掌控者。他成熟温柔，善于倾听。", "rev": "压抑情感，或操控。你可能隐藏真实感受。"}, "宝剑·侍从": {"up": "风信使，警觉的哨兵。他会带来真相或监控信息，但可能不够成熟。", "rev": "流言蜚语，或偷窥。小心口舌之争。"}, "宝剑·骑士": {"up": "风之骑士，言辞犀利。他快速辩论或发起攻击，不留余地。", "rev": "好斗，或伤人。你的话像刀，收一收锋芒。"}, "宝剑·王后": {"up": "风之女王，理智而独立。她能看透谎言，是卓越的咨询师。", "rev": "刻薄，或孤独。你的犀利可能推开关心你的人。"}, "宝剑·国王": {"up": "风之国王，权威的智者。他用逻辑统治，公正不阿。", "rev": "冷酷，或操纵。别忘了人情味。"}, "星币·侍从": {"up": "土信使，勤奋的学生。你正在学习新技能或处理财务事务。", "rev": "懒惰，或错过学习机会。别拖延。"}, "星币·骑士": {"up": "土之骑士，稳健的前行者。他脚踏实地，缓慢但坚定地积累财富。", "rev": "固执，或停滞。你可能太保守。"}, "星币·王后": {"up": "土之女王，丰盛与自然。她连接大地，擅长园艺、理财、照顾家庭。", "rev": "物质主义，或失去根基。别被金钱奴役。"}, "星币·国王": {"up": "土之国王，成功的商业领袖。他稳重、可靠，是财富的象征。", "rev": "贪婪，或破产危机。检查你的资产安全。"}};
const MAJORS=["愚者","魔术师","女祭司","女皇","皇帝","教皇","恋人","战车","力量","隐士","命运之轮","正义","倒吊人","死神","节制","恶魔","高塔","星星","月亮","太阳","审判","世界"];
const SUITS=["权杖","圣杯","宝剑","星币"];
const CARDS=[];
MAJORS.forEach(function(n,i){CARDS.push({id:i+1,name:n,suit:"大阿卡纳"});});
SUITS.forEach(function(s){
  for(var i=1;i<=10;i++) CARDS.push({id:CARDS.length+1,name:s+i,suit:s});
  ["侍从","骑士","王后","国王"].forEach(function(c){CARDS.push({id:CARDS.length+1,name:s+"·"+c,suit:s});});
});
const POS=[{cn:"过去",en:"Past",rn:"I"},{cn:"现在",en:"Present",rn:"II"},{cn:"未来",en:"Future",rn:"III"}];
function imgUrl(id){return "./"+String(id-1).padStart(2,"0")+".png";}

const S={q:"",cards:[],revs:[],pages:[],idx:0,front:"A",busy:false};
const bodyA=document.getElementById("bodyA"), bodyB=document.getElementById("bodyB");
const sheetA=document.getElementById("sheetA"), sheetB=document.getElementById("sheetB");
const book=document.getElementById("book"), cover=document.getElementById("cover"), hint=document.getElementById("hint");

function meaningOf(card,rev){ const m=MEANINGS[card.name]||{up:"",rev:""}; return rev?m.rev:m.up; }
function splitFirst(t){ const m=t.match(/^[^。！？]*[。！？]/); if(!m) return [t,""]; return [m[0], t.slice(m[0].length).trim()]; }

function drawSpread(){
  const pool=CARDS.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  S.cards=pool.slice(0,3); S.revs=S.cards.map(function(){return Math.random()<0.5;});
}

function askHTML(){
  return '<div class="runhead"><span>Liber Sortium</span><span>Quaestio</span></div>'+
  '<div class="main">'+
    '<div class="plateno">The Question</div>'+
    '<div class="qwrap rise r1"><label>You ask</label><input id="qInput" placeholder="写下你要问的那件事" autocomplete="off" value="'+S.q.replace(/"/g,"&quot;")+'"></div>'+
    '<div class="stamps rise r2">'+
      ['感情发展','事业方向','财运状况','人际关系','学业进展','自我成长'].map(function(t){
        return '<button class="stamp" data-q="'+t+'">'+({'感情发展':'感情','事业方向':'事业','财运状况':'财运','人际关系':'人际','学业进展':'学业','自我成长':'成长'})[t]+'</button>';
      }).join('')+
    '</div>'+
    '<p class="rise r3" style="margin:20px 4px 0;font-size:.78rem;line-height:1.95;color:#5C4B39;text-align:center;">把问题写在纸上，牌才知道要回答什么。</p>'+
    '<div class="drawzone rise r4"><button id="drawBtn">抽 牌</button></div>'+
  '</div><div class="folio">— 序 —</div>';
}

function cardHTML(i){
  const c=S.cards[i], rev=S.revs[i], pos=POS[i], text=meaningOf(c,rev);
  const parts=splitFirst(text);
  return '<div class="runhead"><span>Liber Sortium</span><span>'+pos.en+'</span></div>'+
  '<div class="main">'+
    '<div class="plateno rise r1">'+pos.cn+' · Plate '+pos.rn+'</div>'+
    '<div class="art rise r1"><img src="'+imgUrl(c.id)+'" alt="'+c.name+'"><div class="glaze"></div></div>'+
    '<div class="band rise r2"><div class="en">'+c.name+' — '+(rev?'Reversed':'Upright')+'</div><div class="cn">'+parts[0]+'</div></div>'+
    '<div class="moral rise r3"><b>牌 说</b>'+parts[1]+'</div>'+
  '</div><div class="folio rise r4">— '+pos.rn+' —</div>';
}

function synth(){
  const fire=S.cards.filter(function(c){return c.suit==="权杖";}).length;
  const water=S.cards.filter(function(c){return c.suit==="圣杯";}).length;
  const air=S.cards.filter(function(c){return c.suit==="宝剑";}).length;
  const earth=S.cards.filter(function(c){return c.suit==="星币";}).length;
  let energy="四元素俱在，宜顺势而为。";
  if(fire>=2) energy="火气偏盛：你已经知道要动了，缺的只是动。";
  else if(water>=2) energy="水气偏盛：先把情绪安放好，再谈决定。";
  else if(air>=2) energy="风气偏盛：想得多，落笔少，先写下来再走一步。";
  else if(earth>=2) energy="土气偏盛：稳是优点，别稳成不动。";
  const revs=S.revs.filter(Boolean).length;
  const advice = revs>=2 ? "逆位过半——这三天不做决定，比硬冲更有用。" : "三张牌里没有一张在催你，按自己的节奏走。";
  return '<p class="rise r2"><b>牌 阵</b>三张牌分别是「'+S.cards[0].name+'」「'+S.cards[1].name+'」「'+S.cards[2].name+'」。同一副牌，落在过去、现在、未来三个位置上，说的其实是同一件事的三层。</p>'+
         '<p class="rise r3"><b>能 量</b>'+energy+'</p>'+
         '<p class="rise r3"><b>一 句</b>'+advice+'</p>';
}

function endHTML(){
  return '<div class="endp">'+
    '<div class="runhead" style="position:absolute;top:22px;left:26px;right:26px;"><span>Liber Sortium</span><span>Finis</span></div>'+
    '<h2 class="rise r1">牌说完了</h2>'+
    '<div class="lat rise r1">Here the reading rests</div>'+
    '<div class="orn rise r2"><i></i><svg width="20" height="8" viewBox="0 0 20 8" fill="none"><path d="M10 1 L12.4 4 L10 7 L7.6 4 Z" fill="rgba(140,58,46,.6)"/></svg><i></i></div>'+
    '<div class="sum">'+synth()+'</div>'+
    '<button class="again rise r4" id="againBtn">再 问 一 次</button>'+
    '<div class="folio rise r4" style="margin-top:22px;">— 终 —</div>'+
  '</div>';
}

function htmlFor(p){
  if(p.kind==="ask") return askHTML();
  if(p.kind==="card") return cardHTML(p.i);
  return endHTML();
}

function paint(){
  const el = S.front==="A" ? bodyA : bodyB;
  el.innerHTML = htmlFor(S.pages[S.idx]);
  const sheet = S.front==="A" ? sheetA : sheetB;
  sheet.classList.remove("enter"); void sheet.offsetWidth; sheet.classList.add("enter");
  bind(S.pages[S.idx], el);
}

function bind(p, el){
  if(p.kind==="ask"){
    const input=el.querySelector("#qInput");
    el.querySelectorAll(".stamp").forEach(function(s){
      s.onclick=function(e){ e.stopPropagation();
        el.querySelectorAll(".stamp").forEach(function(x){x.classList.remove("on");});
        s.classList.add("on"); input.value=s.dataset.q;
      };
    });
    el.querySelector("#drawBtn").onclick=function(e){
      e.stopPropagation();
      const v=(input.value||"").trim(); if(!v){ input.focus(); return; }
      S.q=v; drawSpread();
      S.pages=[{kind:"ask"},{kind:"card",i:0},{kind:"card",i:1},{kind:"card",i:2},{kind:"fin"}];
      S.idx=1; turn(1,true);
    };
  }
  if(p.kind==="fin"){
    const a=el.querySelector("#againBtn");
    if(a) a.onclick=function(e){ e.stopPropagation(); S.pages=[{kind:"ask"}]; S.idx=0; turn(-1,true); };
  }
}

function turn(dir, force){
  if(S.busy) return;
  const next=S.idx+dir;
  if(!force){
    if(next<0 || next>S.pages.length-1) return;
  } else {
    if(next<0) return;
  }
  S.busy=true;
  const curBody=S.front==="A"?bodyA:bodyB, curSheet=S.front==="A"?sheetA:sheetB;
  const nextSheet=S.front==="A"?sheetB:sheetA, nextBody=S.front==="A"?bodyB:bodyA;
  if(force && next>S.pages.length-1){ S.busy=false; return; }
  S.idx=next;
  nextBody.innerHTML=htmlFor(S.pages[S.idx]);
  nextSheet.style.display="block"; nextSheet.style.transform="rotateY(0deg)"; nextSheet.style.zIndex=1;
  nextSheet.classList.remove("enter"); void nextSheet.offsetWidth; nextSheet.classList.add("enter");
  curSheet.style.zIndex=2;
  bind(S.pages[S.idx], nextBody);
  if(dir>0){
    curSheet.classList.add("turning");
    requestAnimationFrame(function(){ curSheet.style.transform="rotateY(-176deg)"; curSheet.style.boxShadow="60px 0 80px -40px rgba(0,0,0,.75)"; });
    setTimeout(function(){
      curSheet.classList.remove("turning"); curSheet.style.display="none";
      curSheet.style.transform="rotateY(0deg)"; curSheet.style.boxShadow="";
      finish(nextSheet);
    },820);
  } else {
    nextSheet.style.transform="rotateY(-176deg)"; nextSheet.classList.add("turning-in"); nextSheet.style.zIndex=3;
    void nextSheet.offsetWidth;
    requestAnimationFrame(function(){ nextSheet.style.transform="rotateY(0deg)"; });
    setTimeout(function(){ nextSheet.classList.remove("turning-in"); finish(nextSheet); },820);
  }
  hint.classList.add("hide");
}

function finish(newSheet){
  S.front = S.front==="A" ? "B" : "A";
  const other = S.front==="A" ? sheetB : sheetA;
  other.style.display="none"; other.style.zIndex=1;
  newSheet.style.zIndex=2;
  newSheet.classList.remove("enter"); void newSheet.offsetWidth; newSheet.classList.add("enter");
  S.busy=false;
  if(navigator.vibrate) navigator.vibrate(8);
}

cover.onclick=function(){
  cover.classList.add("open");
  setTimeout(function(){
    cover.style.display="none"; book.classList.add("on");
    S.pages=[{kind:"ask"}]; S.idx=0; S.front="A";
    sheetA.style.display="block"; sheetB.style.display="none";
    paint(); hint.classList.remove("hide");
  },700);
};

book.addEventListener("click",function(e){
  if(S.busy) return;
  if(e.target.closest("input,button,.qwrap,.stamps,.drawzone,.again")) return;
  if(e.target.closest(".endp")) return;
  const r=book.getBoundingClientRect(), x=e.clientX-r.left;
  turn(x>r.width*0.38?1:-1);
});

let sx=0,sy=0;
document.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
document.addEventListener("touchend",function(e){
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<45||Math.abs(dy)>Math.abs(dx)) return;
  turn(dx<0?1:-1);
},{passive:true});
</script>
</body>
</html>
