<!DOCTYPE html>
<html lang="zh-CN" data-light="candle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C0A09">
<title>星尘·古牌 · 哥特维多利亚版</title>
<style>
/* ============================================================
   THE GILDED ARCANA
   维多利亚版画 × 中世纪拱券 × 哥特
   三色：墨黑 / 黄铜 / 羊皮纸，加一点牛血红作为印记色
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
:root{
  --ink:#0C0A09;
  --ink-2:#141110;
  --paper:#E7DDC5;
  --paper-hi:#F4EDDC;
  --brass:#A98B4F;
  --brass-hi:#D9BE85;
  --brass-dim:rgba(169,139,79,.42);
  --blood:#6B2320;
  --text:#E3D9C3;
  --text-dim:#9C8E75;
  --hair:rgba(169,139,79,.30);
  --hair-soft:rgba(169,139,79,.16);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --latin:"Didot","Times New Roman",Georgia,serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-light="moon"]{--brass:#9AA6B5;--brass-hi:#CFD8E4;--brass-dim:rgba(154,166,181,.40);--hair:rgba(154,166,181,.30);--hair-soft:rgba(154,166,181,.15);--ink:#08090B;--ink-2:#0D0F12;}

body{
  background:var(--ink);color:var(--text);min-height:100dvh;overflow-x:hidden;position:relative;
  font-family:var(--serif);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  transition:background .6s var(--ease);
}

/* ---------- 背景：暗角 + 细密刻线 ---------- */
.ground{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.ground .vignette{position:absolute;inset:0;
  background:radial-gradient(118% 86% at 50% 8%,rgba(60,48,36,.55) 0%,rgba(12,10,9,.96) 62%,#070605 100%);}
.ground .hatch{position:absolute;inset:0;opacity:.14;
  background-image:repeating-linear-gradient(46deg,rgba(169,139,79,.30) 0 1px,transparent 1px 5px);}
.ground .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/></filter><rect width='200' height='200' filter='url(%23g)' opacity='.5'/></svg>");}

/* ---------- 顶部小工具 ---------- */
.plate{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:30;display:flex;gap:6px;}
.plate button{
  font-family:var(--latin);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--text-dim);background:rgba(12,10,9,.6);border:1px solid var(--hair-soft);
  padding:7px 11px;cursor:pointer;transition:color .35s,border-color .35s;}
.plate button:active{color:var(--brass-hi);border-color:var(--brass);}

/* ---------- 版面 ---------- */
.wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;padding:0 20px 56px;}

/* ---------- 封面 ---------- */
.cover{width:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;transition:opacity .8s var(--ease),transform .8s var(--ease);}
.cover.gone{opacity:0;transform:translateY(-20px);pointer-events:none;position:absolute;}

.arch{position:relative;width:min(84vw,340px);aspect-ratio:300/470;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 26px;}
.arch > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}

.crest-mark{font-family:var(--latin);font-size:.58rem;letter-spacing:.42em;color:var(--brass);
  text-transform:uppercase;opacity:.85;margin-bottom:20px;}
h1{
  font-size:clamp(1.9rem,8.2vw,2.7rem);font-weight:500;letter-spacing:.26em;text-indent:.26em;
  color:var(--paper-hi);line-height:1.5;
  text-shadow:0 1px 0 rgba(0,0,0,.7),0 0 30px rgba(169,139,79,.14);
}
.arch .latin{margin-top:14px;font-family:var(--latin);font-size:.56rem;letter-spacing:.46em;
  text-indent:.46em;color:var(--brass);opacity:.9;text-transform:uppercase;}
.arch .cn-sub{margin-top:16px;font-size:.72rem;letter-spacing:.4em;text-indent:.4em;color:var(--text-dim);}

.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;width:100%;}
.divider i{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--hair),transparent);}
.divider svg{width:26px;height:10px;flex:none;opacity:.9;}

.btn{
  font-family:var(--serif);font-size:.84rem;letter-spacing:.34em;text-indent:.34em;
  color:var(--brass-hi);background:transparent;border:1px solid var(--brass-dim);
  padding:14px 40px;cursor:pointer;position:relative;transition:all .45s var(--ease);
}
.btn::before{content:"";position:absolute;inset:3px;border:1px solid var(--hair-soft);pointer-events:none;transition:border-color .45s;}
.btn:active{background:rgba(169,139,79,.10);color:#FFF3DA;border-color:var(--brass);}
.btn:active::before{border-color:var(--brass-dim);}
.arch .btn{margin-top:30px;}

/* ---------- 内页 ---------- */
.pane{width:100%;max-width:520px;display:none;flex-direction:column;gap:22px;padding-top:52px;}
.pane.on{display:flex;animation:enter .75s var(--ease) both;}
@keyframes enter{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

.caption{display:flex;align-items:center;gap:12px;font-family:var(--latin);font-size:.56rem;
  letter-spacing:.42em;text-transform:uppercase;color:var(--brass);}
.caption::before,.caption::after{content:"";height:1px;flex:1;background:var(--hair-soft);}

/* 提问牌 */
.quill{
  border:1px solid var(--hair);background:linear-gradient(180deg,rgba(231,221,197,.05),rgba(231,221,197,.015));
  padding:22px 20px 20px;position:relative;
}
.quill::before{content:"";position:absolute;inset:4px;border:1px solid var(--hair-soft);pointer-events:none;}
.quill label{display:block;font-size:.62rem;letter-spacing:.34em;color:var(--brass);margin-bottom:14px;}
.quill input{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--hair);
  color:var(--paper-hi);font-family:var(--serif);font-size:1rem;letter-spacing:.06em;
  padding:8px 1px;outline:none;transition:border-color .4s;
}
.quill input::placeholder{color:var(--text-dim);opacity:.62;font-size:.92rem;}
.quill input:focus{border-color:var(--brass);}

.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px;}
.tag{
  font-family:var(--serif);font-size:.7rem;letter-spacing:.16em;padding:6px 12px;cursor:pointer;
  color:var(--text-dim);background:transparent;border:1px solid var(--hair-soft);transition:all .3s;
}
.tag.on{color:var(--ink);background:var(--brass-hi);border-color:var(--brass-hi);}

/* 牌位 */
.spread{display:flex;justify-content:center;gap:clamp(9px,3vw,18px);min-height:196px;align-items:center;}
.slot{perspective:1400px;position:relative;}
.card{width:clamp(80px,24.5vw,104px);aspect-ratio:270/456;position:relative;
  transform-style:preserve-3d;transition:transform 1s var(--ease);cursor:pointer;}
.slot.flipped .card{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
  border:1px solid var(--brass-dim);box-shadow:0 18px 34px -20px #000;}
.face img{width:100%;height:100%;object-fit:cover;display:block;}
.face.front{transform:rotateY(180deg);background:var(--paper);}
.face.back{background:#120F0D;display:grid;place-items:center;}
.face.back img{position:absolute;inset:0;object-fit:cover;filter:brightness(.85) contrast(1.05);}
.face.back::after{content:"";position:absolute;inset:5px;border:1px solid var(--brass-dim);}

/* 解读：羊皮纸页 */
.folio{
  display:none;background:var(--paper);color:#2A2119;padding:30px 24px 28px;position:relative;
  box-shadow:0 30px 60px -34px #000,inset 0 0 60px rgba(120,96,58,.18);
  border:1px solid rgba(42,33,25,.35);
}
.folio.on{display:block;animation:enter .8s var(--ease) both;}
.folio::before{content:"";position:absolute;inset:7px;border:1px solid rgba(42,33,25,.20);pointer-events:none;}
.folio::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/></filter><rect width='180' height='180' filter='url(%23p)' opacity='.35'/></svg>");
  mix-blend-mode:multiply;}
.folio > *{position:relative;z-index:1;}
.folio .head{text-align:center;padding-bottom:14px;border-bottom:1px solid rgba(42,33,25,.22);margin-bottom:18px;}
.folio .head .lat{font-family:var(--latin);font-size:.55rem;letter-spacing:.4em;text-transform:uppercase;
  color:#7A5C33;margin-bottom:8px;}
.folio .head .q{font-size:1rem;letter-spacing:.12em;color:#2A2119;}
.folio h4{font-size:.62rem;letter-spacing:.34em;color:#7A5C33;font-weight:500;margin:18px 0 8px;}
.folio h4:first-of-type{margin-top:0;}
.folio p{font-size:.9rem;line-height:2.05;letter-spacing:.02em;color:#2A2119;white-space:pre-line;}
.folio .drop::first-letter{
  font-size:2.6rem;float:left;line-height:.82;padding:6px 10px 0 0;color:var(--blood);
  font-family:var(--latin);
}
.folio .seal{display:flex;justify-content:center;margin-top:22px;opacity:.85;}

/* 底部 */
.colophon{margin-top:6px;text-align:center;font-family:var(--latin);font-size:.54rem;
  letter-spacing:.3em;text-transform:uppercase;color:var(--text-dim);opacity:.55;}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="ground">
  <div class="vignette"></div>
  <div class="hatch"></div>
  <div class="grain"></div>
</div>

<div class="plate">
  <button id="lightBtn">冷月</button>
</div>

<div class="wrap">
  <!-- 封面：尖拱 -->
  <section class="cover" id="cover">
    <div class="arch">
      <svg viewBox="0 0 300 470" fill="none" aria-hidden="true">
        <!-- 外拱 -->
        <path d="M22 452 V196 C22 96 76 34 150 22 C224 34 278 96 278 196 V452" stroke="var(--brass-dim)" stroke-width="1"/>
        <!-- 内拱 -->
        <path d="M34 452 V200 C34 108 84 50 150 38 C216 50 266 108 266 200 V452" stroke="var(--hair-soft)" stroke-width="1"/>
        <!-- 拱顶小玫瑰花窗 -->
        <circle cx="150" cy="86" r="17" stroke="var(--brass-dim)" stroke-width=".8" fill="none"/>
        <circle cx="150" cy="86" r="6" stroke="var(--brass-dim)" stroke-width=".8" fill="none"/>
        <path d="M150 69 V103 M133 86 H167 M138 74 L162 98 M162 74 L138 98" stroke="var(--hair-soft)" stroke-width=".6"/>
        <!-- 两侧小柱 -->
        <path d="M22 452 V300 M278 452 V300" stroke="var(--brass-dim)" stroke-width="1"/>
        <path d="M16 300 h12 M272 300 h12" stroke="var(--brass-dim)" stroke-width="1"/>
        <path d="M16 452 h12 M272 452 h12" stroke="var(--brass-dim)" stroke-width="1"/>
      </svg>

      <div class="crest-mark">Est. MMXXVI</div>
      <h1>星尘·古牌</h1>
      <div class="latin">The Gilded Arcana</div>
      <div class="divider">
        <i></i>
        <svg viewBox="0 0 26 10" fill="none"><path d="M0 5 H8 M18 5 H26" stroke="var(--brass-dim)" stroke-width=".8"/><path d="M13 1.2 L16.2 5 L13 8.8 L9.8 5 Z" stroke="var(--brass)" stroke-width=".8"/></svg>
        <i></i>
      </div>
      <div class="cn-sub">一次只问一件事</div>
      <button class="btn" id="enterBtn">翻 开</button>
    </div>
  </section>

  <!-- 内页 -->
  <section class="pane" id="pane">
    <div class="caption">Quaestio</div>

    <div class="quill">
      <label>你想问什么</label>
      <input id="qInput" placeholder="例如：这段关系还要继续吗" autocomplete="off">
      <div class="tags">
        <button class="tag" data-q="感情发展">感情</button>
        <button class="tag" data-q="事业方向">事业</button>
        <button class="tag" data-q="财运状况">财运</button>
        <button class="tag" data-q="自我成长">成长</button>
      </div>
    </div>

    <div class="spread" id="spread"></div>

    <button class="btn" id="drawBtn" style="align-self:center;">抽 牌</button>

    <article class="folio" id="folio">
      <div class="head">
        <div class="lat">Sors · Sortes</div>
        <div class="q" id="fq"></div>
      </div>
      <h4>牌 面</h4>
      <p class="drop" id="sec1"></p>
      <h4>能 量</h4>
      <p id="sec2"></p>
      <h4>提 醒</h4>
      <p id="sec3"></p>
      <div class="seal">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
          <circle cx="17" cy="17" r="15.5" stroke="rgba(107,35,32,.7)" stroke-width="1"/>
          <circle cx="17" cy="17" r="12" stroke="rgba(107,35,32,.35)" stroke-width=".7"/>
          <path d="M17 8 L18.6 15 L25 17 L18.6 19 L17 26 L15.4 19 L9 17 L15.4 15 Z" fill="rgba(107,35,32,.55)"/>
        </svg>
      </div>
    </article>

    <p class="colophon">Visual preview · Index untouched</p>
  </section>
</div>

<script>
(function(){
  const btn=document.getElementById('lightBtn');
  btn.onclick=()=>{
    const cur=document.documentElement.dataset.light;
    const next=cur==='candle'?'moon':'candle';
    document.documentElement.dataset.light=next;
    btn.textContent=next==='candle'?'冷月':'烛光';
  };
})();

const cover=document.getElementById('cover'), pane=document.getElementById('pane');
document.getElementById('enterBtn').onclick=()=>{cover.classList.add('gone');pane.classList.add('on');};

document.querySelectorAll('.tag').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('qInput').value=t.dataset.q;
  };
});

const SAMPLE=[
  {img:'./00.png',name:'愚者',pos:'过去',text:'你从一个不计后果的起点出发，带的不是经验，是勇气。那份天真至今仍是你身上最轻的东西。'},
  {img:'./01.png',name:'魔术师',pos:'现在',text:'工具已经在手里，缺的是把想法落地的那一次抬手。你比自己以为的更有准备。'},
  {img:'./12.png',name:'倒吊人',pos:'未来',text:'接下来会有一段“卡住”的时间，那不是惩罚。它是在替你按下暂停键。'}
];

const spread=document.getElementById('spread'), folio=document.getElementById('folio');
let flipped=0, built=false;

function render(){
  if(built) return; built=true;
  spread.innerHTML=SAMPLE.map((c,i)=>`
    <div class="slot" data-i="${i}">
      <div class="card">
        <div class="face back"><img src="./beibu.png" alt="" onerror="this.style.display='none'"></div>
        <div class="face front"><img src="${c.img}" alt="${c.name}"></div>
      </div>
    </div>`).join('');
  spread.querySelectorAll('.slot').forEach(slot=>{
    slot.onclick=()=>{
      if(slot.classList.contains('flipped')) return;
      slot.classList.add('flipped');
      if(navigator.vibrate) navigator.vibrate(10);
      flipped++;
      if(flipped===SAMPLE.length) setTimeout(show,720);
    };
  });
}

function show(){
  document.getElementById('fq').textContent=document.getElementById('qInput').value.trim()||'——';
  document.getElementById('sec1').textContent=SAMPLE.map(c=>`【${c.pos}】${c.name}　${c.text}`).join('\n\n');
  document.getElementById('sec2').textContent='火与水各一，风缺席。你既不缺动力也不缺感受，缺的是一个不被打扰的、干脆的决定。';
  document.getElementById('sec3').textContent='别急着让事情有结果。这一轮牌最想说的是：允许自己暂时不知道答案。';
  folio.classList.add('on');
  try{ folio.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
}

document.getElementById('drawBtn').onclick=()=>{
  if(!document.getElementById('qInput').value.trim()){document.getElementById('qInput').focus();return;}
  render(); folio.classList.remove('on'); flipped=0;
  spread.querySelectorAll('.slot').forEach(s=>s.classList.remove('flipped'));
  spread.querySelectorAll('.slot').forEach((s,i)=>{
    s.style.opacity='0'; s.style.transform='translateY(14px)';
    setTimeout(()=>{s.style.transition='opacity .55s ease,transform .55s ease';s.style.opacity='1';s.style.transform='none';},90*i);
  });
  if(navigator.vibrate) navigator.vibrate(18);
};
</script>
</body>
</html>
