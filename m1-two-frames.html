<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<title>M1 · 两帧：屋 / 世界</title>
<style>
@font-face{font-family:"Xingchen Serif";src:url("./assets/fonts/noto-serif-sc-subset.woff2") format("woff2");font-display:swap}
:root{--serif:"Xingchen Serif","Songti SC","Noto Serif CJK SC",Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#040506;overflow:hidden}
body{font-family:var(--serif);color:#e8dcc4;display:flex;align-items:center;justify-content:center}

.stage{position:relative;width:100%;height:100dvh;max-width:560px;overflow:hidden;background:#040506}
.frame{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .85s ease,visibility .85s}
.frame.on{opacity:1;visibility:visible}
.frame svg{display:block;width:100%;height:100%}

.caption{position:absolute;left:0;right:0;top:calc(18px + env(safe-area-inset-top));z-index:20;
  text-align:center;font-size:10.5px;letter-spacing:.42em;text-indent:.42em;
  color:rgba(240,230,208,.72);pointer-events:none;
  text-shadow:0 1px 10px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.6)}

.toggle{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:5px;z-index:30;background:rgba(6,7,9,.55);border:1px solid rgba(200,165,103,.24);
  padding:4px;border-radius:2px}
.toggle button{border:0;background:none;color:rgba(232,220,196,.62);font-family:var(--serif);
  font-size:11px;letter-spacing:.26em;text-indent:.26em;padding:8px 20px;border-radius:1px;cursor:pointer}
.toggle button.on{background:rgba(200,165,103,.20);color:#f4e8ce}
</style>
</head>

<script>
(function(){
  var room = document.getElementById('frameRoom');
  var world = document.getElementById('frameWorld');
  var bR = document.getElementById('btnRoom');
  var bW = document.getElementById('btnWorld');
  function show(w){
    var isW = w === 'world';
    world.classList.toggle('on', isW);
    room.classList.toggle('on', !isW);
    bW.classList.toggle('on', isW);
    bR.classList.toggle('on', !isW);
  }
  bR.addEventListener('click', function(){ show('room'); });
  bW.addEventListener('click', function(){ show('world'); });
  var x0 = null, stage = document.querySelector('.stage');
  stage.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 46) show(dx < 0 ? 'world' : 'room');
    x0 = null;
  }, {passive:true});
})();
</script>
